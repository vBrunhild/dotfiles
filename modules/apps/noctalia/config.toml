[bar.default]
auto_hide = true
auto_hide_delay_ms = 250
background_opacity = 0.79999998211860657
capsule = true
center = [ "workspaces" ]
compositor_blur = false
concave_edge_corners = false
end = [ "tray", "notifications", "clipboard", "battery" ]
font_family = "Inter"
reserve_space = false
start = [ "control-center", "clock", "network", "bluetooth", "media" ]

[battery]
warning_threshold = 15

[battery.device."/org/freedesktop/UPower/devices/headset_dev_84_AC_60_05_6D_BB"]
warning_threshold = 20

[calendar]
enabled = true

[control_center]
hidden_tabs = [ "monitor", "weather", "calendar", "notifications", "screen-time" ]

[desktop_widgets]
enabled = false

[dock]
background_opacity = 0.79999998211860657

[lockscreen]
transition = [ "fade" ]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
box_height = 196.0
box_width = 810.0
cx = 683.0
cy = 586.0
output = "eDP-1"
placement_height = 768.0
placement_width = 1366.0
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
background_color = "surface_variant"
background_opacity = 0.88
background_radius = 12.0
center_password_text = false
input_opacity = 1.0
input_radius = 6.0
layout = "regular"
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_media = true
show_password_reveal = true
show_session_buttons = true
show_unlock_hint = true
show_weather = true

[notification]
