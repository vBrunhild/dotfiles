[osd]
background_opacity = 0.80

[shell]
avatar_path = "/home/brunhild/dotfiles/modules/apps/noctalia/avatar.png"
font_family = "Inter"
panel_anchor_bar = "default"
password_style = "random"
polkit_agent = true
popup_shadows = false
settings_window_translucent = true

[shell.animation]
enabled = false

[shell.launcher]
categories = false
category_icons_only = true
compact = true
fetch_exchange_rates = false
layout = "simple"
show_app_actions = true

[shell.panel]
